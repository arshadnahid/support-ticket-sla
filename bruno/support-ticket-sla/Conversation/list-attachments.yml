info:
  name: list attachments
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/tickets/{{ticketNumber}}/attachments"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

docs: |-
  Every file on the ticket and its replies that you may see. Files on internal notes are listed for staff only.
  Each entry has a download_url.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
