info:
  name: upload files to ticket
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/tickets/{{ticketNumber}}/attachments"
  headers:
    - name: Accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: files[]
        type: file
        value:
          - ./sample.pdf
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201 && res.body.data.length) {
          bru.setEnvVar("attachmentId", res.body.data[0].id);
        }

docs: |-
  Attaches files to the ticket itself (not to a reply). Replace ./sample.pdf with a real file.
  Same limits and people as replying. Saves the first file id as attachmentId.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
