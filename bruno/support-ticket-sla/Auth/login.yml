info:
  name: login
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "nahid@gmail.com",
        "password": "12345678"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setEnvVar("accessToken", res.body.data.access_token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
