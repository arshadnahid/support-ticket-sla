info:
  name: change status
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/tickets/{{ticketNumber}}/status"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "status": "in_progress"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
