info:
  name: create ticket
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/tickets"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "subject": "Cannot log in",
        "description": "I get an error after entering my password.",
        "priority": "high",
        "category_id": 2
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) {
          bru.setEnvVar("ticketNumber", res.body.data.number);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
