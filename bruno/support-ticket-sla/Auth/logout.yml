info:
  name: logout
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/auth/logout"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setEnvVar("accessToken", "");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
