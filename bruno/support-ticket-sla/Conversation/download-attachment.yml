info:
  name: download attachment
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/tickets/{{ticketNumber}}/attachments/{{attachmentId}}"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

docs: |-
  Downloads one file (needs the Bearer token). Use Save response in Bruno to keep the file.
  A file on an internal note returns 404 to customers. Run 'upload files to ticket' first to set attachmentId.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
