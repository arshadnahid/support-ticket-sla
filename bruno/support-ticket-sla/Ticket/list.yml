info:
  name: list tickets
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/tickets?page=1&per_page=15&sort=created_desc"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

docs: |-
  Every ticket the current user may see (customer: own, agent: assigned + unassigned, admin: all).

  Query:
  - page, per_page (default 15, max 100)
  - status: open | in_progress | waiting_for_customer | resolved | closed
  - sort: sla_deadline (earliest deadline first, none last) | created_asc | created_desc (default order)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
