info:
  name: list resolved-closed tickets
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/tickets/resolved?page=1&per_page=15"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

docs: |-
  Resolved and closed tickets, most recently updated first. Use it for history and reporting on finished work.

  Who can call it: any logged-in, enabled user (Bearer token). Results are filtered by role:
  - customer: only tickets they created
  - agent: tickets assigned to them plus the unassigned queue
  - admin: all tickets

  Query: page (default 1), per_page (default 15).

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
